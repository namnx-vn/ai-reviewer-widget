name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pin npm
        run: npm install --global npm@11.6.0 --no-audit --no-fund

      - run: npm install

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Secret scan
        run: npm run security:secrets

      - name: Generate SBOM
        run: npm sbom --package-lock-only --sbom-format=cyclonedx > sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Evaluation smoke corpus
        run: npm run test:evaluation

      - name: Evaluation quality report
        run: npm run --silent evaluation:report > evaluation-quality.json

      - name: Upload evaluation quality report
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-quality
          path: evaluation-quality.json

      - name: Real-world corpus observations
        run: npm run --silent evaluation:real-world-report > real-world-observations.json

      - name: Upload real-world corpus observations
        uses: actions/upload-artifact@v4
        with:
          name: real-world-observations
          path: real-world-observations.json

      - name: Medium review benchmark
        run: npm run --silent benchmark:review -- medium > benchmark-medium.json

      - name: Upload review benchmark
        uses: actions/upload-artifact@v4
        with:
          name: review-benchmark-medium
          path: benchmark-medium.json

      - name: Tests and coverage
        run: npm run test:coverage

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Packed CLI package validation
        run: npm run test:package

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: build.log

  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pin npm
        run: npm install --global npm@11.6.0 --no-audit --no-fund

      - run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
