name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Secret scan
        run: npm run security:secrets

      - name: Generate SBOM
        run: npm sbom --package-lock-only --sbom-format=cyclonedx > sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Evaluation smoke corpus
        run: npm run test:evaluation

      - name: Medium review benchmark
        run: npm run benchmark:review -- medium > benchmark-medium.json

      - name: Upload review benchmark
        uses: actions/upload-artifact@v4
        with:
          name: review-benchmark-medium
          path: benchmark-medium.json

      - name: Tests and coverage
        run: npm run test:coverage

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: build.log

  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
