name: 🤖 AI Code Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: AI Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Execute trusted reviewer code; PR head content is fetched by API.
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Secret scan
        run: npm run security:secrets

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test and coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: AI Review
        id: ai-review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_REVIEW_MODE: ${{ vars.AI_REVIEW_MODE }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SECURITY_GATE_PROFILE: security/banking
          SECURITY_GATE_BASELINE_IDS: ${{ vars.SECURITY_GATE_BASELINE_IDS }}
          SECURITY_GATE_SUPPRESSIONS_JSON: ${{ vars.SECURITY_GATE_SUPPRESSIONS_JSON }}
        run: npm run review:pr

      - name: Upload review artifacts
        if: always() && steps.ai-review.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-${{ github.event.pull_request.number }}
          path: ai-reviewer-artifacts
          if-no-files-found: warn
          retention-days: 14
